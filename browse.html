<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <title>EKSU BRO-Browse pdfs</title>
  <link rel="stylesheet" href="browse.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.15.349/pdf.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Font Awesome for Icons -->
</head>

<body>
   <section class="home" id="home">
    <div class="fluid-bg"></div>

    <nav class="navbar">
      <div class="logo">EKSU BRO</div>

      <div class="menu" id="menu">
        <a href="#home">Home</a>

        <a href="https://eksubroblog12.vercel.app">Blog</a>
      </div>

      <!-- Mobile Toggles -->
      <i class="fa fa-bars" id="hamburgerBtn"></i>
      <i class="fa fa-times" id="closeBtn"></i>
    </nav>

    <div class="hero">
      <h1 class="bigtext">EKSU BRO</h1>
      <h3 class="smalltext">pastquestions · blog · web3</h3>
      <div class="search-container">

  </section>

  <!-- Browse PDFs Section -->
  <section class="browse-pdfs" id="browse-pdfs">
    <h1 class="browse-title">Browse PDFs</h1>

    <!-- Search Bar -->
    <section class="search-section">
      <input type="text" id="search-bar" placeholder="Search PDFs..." oninput="searchPDFs()">
    </section>

    <h5>This are the list of available PDFs</h5>

    <!-- PDF List -->
    <section id="pdf-list">
      <!-- PDF items will be dynamically added here by JavaScript -->
    </section>

  </section>
  <script>

       const menu = document.getElementById('menu');
    const hambutton = document.getElementById('hamburgerBtn');
    const closebutton = document.getElementById('closeBtn');

    // Toggle menu and buttons
    function toggleMenu() {
      menu.classList.toggle('active');
      document.body.style.overflow = menu.classList.contains('active') ? 'hidden' : 'auto';
    }

    // Event listeners
    hambutton.addEventListener('click', toggleMenu);
    closebutton.addEventListener('click', toggleMenu);

    // Close menu on outside click
    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target) && !hambutton.contains(e.target)) {
        menu.classList.remove('active');
        document.body.style.overflow = 'auto';
      }
    });


  </script>
  <script src="browse.js"></script> <!-- JavaScript file -->
</body>

</html>
